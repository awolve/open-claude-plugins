<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="signum:design-width" content="1280">
<title>Dashboard</title>
<style>
  body { width: 1280px; margin: 0; font-family: system-ui, sans-serif; background: #f2f2f2; color: #333; }
  header { height: 64px; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; background: #ddd; }
  .logo { width: 120px; height: 32px; background: #bbb; }
  header a { color: #333; }
  main { padding: 32px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .tile { height: 160px; padding: 16px; background: #fff; border: 1px solid #ccc; }
  .tile h2 { margin: 0 0 8px; font-size: 16px; }
  .wide { grid-column: span 3; height: 320px; }
</style>
</head>
<body>
<header>
  <div class="logo" title="[LOGO]"></div>
  <a href="login.html">Sign out</a>
</header>
<main>
  <div class="tile"><h2>[METRIC 1]</h2>[VALUE]</div>
  <div class="tile"><h2>[METRIC 2]</h2>[VALUE]</div>
  <div class="tile"><h2>[METRIC 3]</h2>[VALUE]</div>
  <div class="tile wide"><h2>[CHART]</h2></div>
</main>
</body>
</html>
